# Hermes Agent (Nous Research) for a single-tenant per-client VM.
# The client gets a personal AI agent in their messaging apps (Telegram by default)
# PLUS a branded CloudHosting setup panel they use to pick an LLM provider and paste
# their key. One VM = one client.
#
# Topology:
#   gateway  -> the Hermes AGENT. Talks OUT to Telegram (long-polling) and OUT to the
#               LLM provider (avots by default; OpenAI/Anthropic optional via panel).
#               Publishes NOTHING; sits on the private `hermes` bridge. No product UI.
#   panel    -> the CloudHosting onboarding/setup web panel (ghcr.io/cloudhostinglv/
#               ai-panel). Unprivileged. Mounts the SAME ./data the agent uses (rw) so
#               it writes config.yaml + .env that the agent reads, then touches
#               ./data/.apply-request to ask the HOST applier to restart `gateway`.
#               Serves plain HTTP on :8080 on the internal `web` network only.
#   caddy    -> terminates TLS on 80 + 443 for ${PANEL_DOMAIN} (Let's Encrypt, HTTP-01)
#               and reverse-proxies :443 -> panel:8080. This is the ONLY inbound
#               surface. (Hermes is an AGENT, so there is NO product UI port — only
#               :443 = the panel. No :8443.)
#   dashboard-> OPTIONAL local admin UI on 127.0.0.1:9119 only (loopback). Off by default.
#               It stores API keys; never expose it off-box. Reach it via SSH tunnel:
#                 ssh -L 9119:localhost:9119 <vm>
#
# NETWORK MODEL CHANGE: earlier revisions of this stack were strictly outbound-only.
# Adding the setup panel means the VM now accepts INBOUND 80 + 443 (panel + ACME).
# The agent (`gateway`) still publishes nothing and stays on its own private bridge;
# only Caddy is internet-facing. See README "Network model".
#
# UID / PERMS DECISION (shared ./data):
#   The panel image runs as uid 10001 by default and chmods the .env it writes to 0600
#   (owner-only). Hermes runs as uid 10000 (the image default). To let the agent read a
#   0600 .env the panel wrote, we run the PANEL AS uid 10000 too (user: "10000:10000").
#   Then both processes are the same uid, ./data is owned by 10000 (firstboot chowns it),
#   and the 0600 secret stays owner-only (best for a key) while remaining readable by the
#   agent. No group gymnastics, no world-readable secret, no .env knob. firstboot.sh
#   enforces the ownership/mode. (If a future image changes its uid, update it here.)
#
# State: everything (config.yaml, .env, sessions, skills, memories) lives in the
# mounted host data dir ./data -> /opt/data (agent) / /data (panel). The images are
# stateless; upgrade by bumping a pinned tag and re-pulling without losing state.
#
# Hardening: no-new-privileges everywhere, NO docker.sock mount anywhere, resource
# limits, cap_drop. IMPORTANT: inside-container execution backends make Hermes SKIP
# dangerous-command approval (the container is treated as the security boundary), so
# the VM and its egress are the real boundary. Keep the box patched + egress-restricted.

x-restart: &restart unless-stopped

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    # PIN — re-verify (doctor + live tool call) before baking the golden image.
    # As of 2026-06-06 the newest patched stable is tag v2026.6.5 (Docker Hub).
    # Verified live on vps-60-156 2026-06-06: gateway healthy, bot replies with
    # real content via avots (plain chat OK; no empty/blocked regressions).
    # Pinned by digest for immutability (the tag's multi-arch index digest):
    #   nousresearch/hermes-agent:v2026.6.5
    #   == sha256:9ad3b04ec916ea2c2da22358fd43b024c788d74073210695af88bfc2e63869b4
    # Prev pin was v2026.5.29.2 (== sha256:2bba4ab3…f7bfa3).
    # Re-check Docker Hub + GitHub releases and re-bake when a newer patch ships
    # (this project is pre-1.0 and ships CVEs/fixes frequently).
    image: nousresearch/hermes-agent:v2026.6.5@sha256:9ad3b04ec916ea2c2da22358fd43b024c788d74073210695af88bfc2e63869b4
    container_name: hermes
    restart: *restart
    # Private bridge, NOT host networking. No ports published => unreachable off-box.
    networks:
      - hermes
    # NO env_file here on purpose. The agent's SECRETS (provider key/base_url +
    # Telegram bot token/allowed users) live in the DATA DIR, not the compose-level
    # .env: Hermes loads /opt/data/.env (and expands ${VAR} in /opt/data/config.yaml)
    # itself at startup. The CloudHosting panel is the single source of truth for
    # those secrets — it writes ./data/config.yaml + ./data/.env and the host applier
    # restarts this service. Injecting the compose-level .env here would create a
    # second, conflicting source, so we deliberately omit env_file.
    environment:
      # Map the in-container hermes user to the host owner of ./data so files written
      # inside stay readable/writable on the host. Hardcoded to 10000 (the image
      # default); no .env knob. If a future image changes its uid, bump it here.
      - HERMES_UID=10000
      - HERMES_GID=10000
      # Telegram + provider config is NOT passed here: the agent reads it from the
      # data dir (config.yaml + /opt/data/.env). config.yaml references
      # ${OPENAI_API_KEY}/${AVOTS_API_KEY}, which Hermes resolves from /opt/data/.env.
      # The gateway sets HERMES_EXEC_ASK=1 itself; we do NOT enable YOLO mode.
      #
      # API server (OpenAI-compatible, port 8642) stays OFF. We only use chat platforms.
      # Do NOT set API_SERVER_ENABLED / API_SERVER_HOST here. If you ever must, bind it
      # to 127.0.0.1 and set API_SERVER_KEY, and publish nothing publicly.
    volumes:
      # Host data dir holds config.yaml + .env + sessions/skills/memories.
      # The panel (below) writes config.yaml + .env into this SAME dir.
      - ./data:/opt/data
    command: ["gateway", "run"]
    security_opt:
      - no-new-privileges:true
    # The Hermes image is s6-overlay based: PID 1 starts as root and drops to the
    # hermes service user (uid 10000) via s6-applyuidgid. That drop needs a few Linux
    # capabilities. A blanket `cap_drop: ALL` makes it fail with
    #   s6-applyuidgid: fatal: unable to set supplementary group list: Operation not permitted
    # and the container CRASH-LOOPS before the agent ever starts (Telegram never
    # connects, the bot is silent). So drop ALL, then add back ONLY the minimal set
    # s6-overlay needs to initialise and switch user:
    #   SETUID/SETGID            - s6-applyuidgid: root -> uid 10000 (setgroups/setgid/setuid)
    #   CHOWN/FOWNER/DAC_OVERRIDE - cont-init chowns the /run/s6 supervise trees + /opt/data
    #   KILL                     - s6 supervisor signals its services
    # The agent itself needs no caps to talk outbound; this set is purely for init.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - KILL
    # Sane resource limits for a $5-$20 VM. Tune per client plan.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
          pids: 512
    mem_swappiness: 0
    logging: *logging

  # CloudHosting unified setup panel (PUBLIC image). The client logs in with
  # PANEL_PASSWORD, picks a provider (avots recommended/default), pastes their key,
  # and optionally wires the Telegram bot. The panel writes config.yaml + .env into
  # the SHARED ./data and touches ./data/.apply-request; the HOST applier then
  # restarts `gateway`. Unprivileged, no docker.sock.
  panel:
    image: ghcr.io/cloudhostinglv/ai-panel:latest
    container_name: hermes-panel
    restart: *restart
    # Run as the agent's uid (10000) so the 0600 .env the panel writes is owned by, and
    # therefore readable by, the Hermes agent. See "UID / PERMS DECISION" up top.
    user: "10000:10000"
    depends_on:
      - gateway
    environment:
      PRODUCT: "hermes"
      PANEL_PASSWORD: "${PANEL_PASSWORD}"      # REQUIRED, the panel fails closed if empty
      PANEL_REQUIRE_AUTH: "1"                  # enforce the above: empty password => refuse to start (fail closed)
      PANEL_PORT: "8080"
      PANEL_DOMAIN: "${PANEL_DOMAIN}"          # public host; firstboot derives it from IP if blank
      HERMES_DATA_DIR: "/data"                 # panel writes config.yaml/.env here (= gateway's /opt/data)
      AVOTS_API_KEY: "${AVOTS_API_KEY:-}"      # turnkey: if set, panel auto-connects avots on startup
      HOME: "/data"                            # writable home for uid 10000 so OAuth client_id/token persist (/data/.config)
    volumes:
      # SAME host data dir the agent mounts (agent sees /opt/data, panel sees /data).
      # rw so the panel can write config.yaml + .env + .apply-request.
      - ./data:/data
    # Reachable only on the internal `web` network as panel:8080; Caddy fronts it.
    # NOT published on 0.0.0.0.
    expose:
      - "8080"
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NO docker.sock mount — by design. The host applier holds docker access.
    logging: *logging

  # TLS terminator + reverse proxy. The ONLY internet-facing service. Gets a real
  # Let's Encrypt cert via HTTP-01 for ${PANEL_DOMAIN} (the A-record already exists by
  # the vps-<o3>-<o4>.cloudhosting.lv convention, so no DNS step is needed).
  caddy:
    image: caddy:2.8-alpine
    container_name: hermes-caddy
    restart: *restart
    depends_on:
      - panel
    ports:
      - "80:80"            # ACME HTTP-01 challenge (Let's Encrypt); panel itself is on 8443
      - "8443:8443"        # the CloudHosting panel (ALWAYS on 8443, all products)
      - "8443:8443/udp"    # HTTP/3 (QUIC) for the panel
    environment:
      PANEL_DOMAIN: "${PANEL_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # LE certs + account (persisted)
      - caddy_config:/config   # Caddy autosave state
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # OPTIONAL local admin dashboard. Disabled by default.
  # To enable: set HERMES_DASHBOARD=1 in .env, then `docker compose up -d dashboard`.
  # Upstream requires the dashboard to SHARE the gateway's PID namespace (its
  # gateway-liveness probe needs it), so we attach to the gateway container's
  # network + PID namespace rather than running it standalone.
  dashboard:
    image: nousresearch/hermes-agent:v2026.5.29.2@sha256:2bba4ab37729ebdd864d4caf277b24fec4cd8bfc2855185fd9f4c90f9bf7bfa3
    container_name: hermes-dashboard
    restart: *restart
    profiles: ["dashboard"]   # only starts when explicitly requested
    depends_on:
      - gateway
    # Share the gateway's net + PID namespaces (required for liveness detection).
    network_mode: "service:gateway"
    pid: "service:gateway"
    # Same as gateway: NO env_file. Secrets live in the data dir (config.yaml +
    # /opt/data/.env), which the dashboard reads directly. Keep the two in sync.
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
    volumes:
      - ./data:/opt/data
    # Loopback-only bind. 127.0.0.1 is NOT reachable off-box; reach via SSH tunnel.
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

# No docker.sock is mounted anywhere on purpose: the agent can run arbitrary
# commands/code, so the host Docker socket must never be reachable from the stack.
# Docker control lives ONLY in the host-side systemd applier (see applier/).

networks:
  # Agent's private bridge — no published ports, no panel/caddy on it.
  hermes:
    driver: bridge
  # Panel <-> Caddy only.
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
