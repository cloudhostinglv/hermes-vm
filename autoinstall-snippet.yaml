# autoinstall-snippet.yaml — drop-in for the client's Ubuntu 24.04 autoinstall.
#
# Brings up the pre-baked Hermes Agent stack (agent + setup panel + Caddy/TLS) for ONE
# client on first boot. This snippet does NOT run docker in-target; it only prepares the
# checkout, secrets, and a first-boot systemd oneshot. The actual `docker compose up` +
# applier install happens in firstboot.sh on the first real boot (where networking +
# the docker daemon are live).
#
# Placeholders use the existing {placeholder} templating; the provisioner substitutes:
#   {panel_password}      -> the panel login password (REQUIRED; the panel fails closed)
# NOTE: the provider/avots key, the Telegram bot token and allowed users are NOT injected
# here. The client enters them in the panel, which writes them into the agent's data-dir
# config and triggers the applier. Autoinstall only sets PANEL_PASSWORD (+ derives domain).
# PANEL_DOMAIN is intentionally left blank so firstboot.sh auto-derives
#   vps-<3rd octet>-<4th octet>.cloudhosting.lv from the VM's primary IPv4.
#
# Merge these keys into the VM's main autoinstall user-data (curtin runs late-commands
# in-target). If your pipeline keeps packages/late-commands in the autoinstall
# `user-data:` block, concatenate accordingly.
#
# NOTE on quoting: each late-command is a single-line shell string (printf with \n) so
# YAML never folds a multi-line heredoc body and corrupts the rendered .env / unit.

autoinstall:
  version: 1

  # Packages needed before first boot. docker.io + the compose v2 plugin + git + CA
  # bundle. (Installed in-target; the daemon is started by firstboot, not here.)
  packages:
    - git
    - docker.io
    - docker-compose-v2
    - ca-certificates

  late-commands:
    # All commands run inside the installed system via `curtin in-target`. NO docker
    # here — the daemon/network aren't guaranteed during install. firstboot.sh does it.

    # 1. Make sure the toolchain is present even if `packages:` above was overridden.
    - ["curtin", "in-target", "--", "bash", "-c", "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git docker.io docker-compose-v2 ca-certificates"]

    # 2. Clone the appliance repo to /opt/hermes-vm (image tag is pinned inside docker-compose.yml).
    - ["curtin", "in-target", "--", "bash", "-c", "test -d /opt/hermes-vm || git clone --depth 1 https://github.com/cloudhostinglv/hermes-vm.git /opt/hermes-vm"]

    # 3. Write the compose-level .env. ONLY the panel password + domain + uid/gid.
    #    The provider key, Telegram bot token and allowed users are NOT here — the client
    #    enters them in the panel, which writes them into the agent's data-dir config and
    #    triggers the applier to restart the agent. PANEL_DOMAIN blank => derive from IP.
    - ["curtin", "in-target", "--", "bash", "-c", "umask 077 && printf 'PANEL_PASSWORD=%s\\nPANEL_DOMAIN=\\n' '{panel_password}' > /opt/hermes-vm/.env"]
    - ["curtin", "in-target", "--", "chmod", "0600", "/opt/hermes-vm/.env"]

    # 4. Make firstboot.sh executable, install the shipped first-boot oneshot unit, enable it.
    - ["curtin", "in-target", "--", "chmod", "0755", "/opt/hermes-vm/firstboot.sh"]
    - ["curtin", "in-target", "--", "cp", "/opt/hermes-vm/hermes-firstboot.service", "/etc/systemd/system/hermes-firstboot.service"]
    - ["curtin", "in-target", "--", "systemctl", "enable", "hermes-firstboot.service"]
