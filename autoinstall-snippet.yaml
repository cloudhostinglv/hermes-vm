# cloud-init snippet — drop-in for the per-client autoinstall pipeline.
# Brings up the pre-baked Hermes Agent stack on first boot for ONE client.
#
# Assumes the golden image already has: Docker + compose, and this directory's
# docker-compose.yml + config.yaml present at /srv/avots-vm/hermes/ (image stateless,
# tag pinned). This snippet only injects per-client secrets and starts the stack.
#
# Placeholders use the existing {placeholder} templating; the provisioner substitutes:
#   {avots_key}            -> the client's avots key (av_mcp_...)
#   {telegram_bot_token}   -> the client's Telegram bot token (from @BotFather)
#   {telegram_allowed_users} -> comma-separated numeric Telegram user id(s)
#   {hermes_uid} {hermes_gid} -> host owner of the data dir (often 1000/1000)
#
# Merge these keys into the VM's main cloud-config (do not ship as a standalone file
# unless your pipeline concatenates write_files/runcmd blocks).

write_files:
  # Per-client secrets. Mounted into the container at /opt/data/.env.
  # NOTE: cloud-init logs can include rendered write_files content on some setups;
  # ensure /var/log/cloud-init-output.log is root-only on the golden image.
  - path: /srv/avots-vm/hermes/data/.env
    permissions: "0600"
    owner: "{hermes_uid}:{hermes_gid}"
    content: |
      AVOTS_API_KEY={avots_key}
      OPENAI_API_KEY={avots_key}
      OPENAI_BASE_URL=https://api.avots.ai/openai/v1
      TELEGRAM_BOT_TOKEN={telegram_bot_token}
      TELEGRAM_ALLOWED_USERS={telegram_allowed_users}
      HERMES_UID={hermes_uid}
      HERMES_GID={hermes_gid}

runcmd:
  # Ensure the mounted data dir exists and is owned by the mapped host user, so the
  # container (remapped to HERMES_UID/GID) can read .env + write config.yaml/sessions.
  - [ mkdir, -p, /srv/avots-vm/hermes/data ]
  # config.yaml ships in the image dir; copy it into the data dir Hermes reads from.
  - [ cp, -n, /srv/avots-vm/hermes/config.yaml, /srv/avots-vm/hermes/data/config.yaml ]
  - [ chown, -R, "{hermes_uid}:{hermes_gid}", /srv/avots-vm/hermes/data ]
  - [ chmod, "0600", /srv/avots-vm/hermes/data/.env ]
  # Pull (in case the image isn't pre-baked) and start the stack outbound-only.
  # Dashboard profile is intentionally NOT started (loopback admin UI stays off).
  - [ docker, compose, -f, /srv/avots-vm/hermes/docker-compose.yml, pull ]
  - [ docker, compose, -f, /srv/avots-vm/hermes/docker-compose.yml, up, -d ]
